<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | MGTECHNZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { brandDark:'#0A0A0F', brandMid:'#222429', brandGray:'#88929C', brandSilver:'#C8D0D8', brandWhite:'#F8F9FA' }, fontFamily: { sans: ['Inter','sans-serif'] } } } }
    </script>
    <style>.active{border-bottom:2px solid #222429;padding-bottom:2px;}</style>
</head>
<body class="bg-brandWhite text-brandDark font-sans">
    <header class="w-full px-6 md:px-12 py-6 bg-white shadow-sm fixed z-50 top-0 left-0 right-0">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="text-xl md:text-2xl font-bold tracking-wider">MGTECHNZ</div>
            <div class="hidden md:flex gap-10 font-medium">
                <a href="index.html" class="hover:text-brandGray">Home</a>
                <a href="about.html" class="hover:text-brandGray">About</a>
                <a href="services.html" class="hover:text-brandGray">Services</a>
                <a href="contact.html" class="active">Contact</a>
            </div>
            <div class="md:hidden text-xl"><i class="fa-solid fa-bars"></i></div>
        </nav>
    </header>

    <section class="pt-36 pb-20">
        <div class="max-w-5xl mx-auto px-6 md:px-12">
            <h1 class="text-4xl md:text-5xl font-bold mb-6">Get In Touch</h1>
            <div class="grid md:grid-cols-2 gap-12">
                <div class="space-y-6">
                    <p class="text-lg text-gray-600">We’re here to help with your technology needs. Reach out anytime and we’ll respond promptly.</p>
                    <div class="space-y-4">
                        <div class="flex items-center gap-4">
                            <i class="fa-solid fa-envelope text-xl text-brandDark"></i>
                            <div>info@mgtechnz.com</div>
                        </div>
                        <div class="flex items-center gap-4">
                            <i class="fa-solid fa-phone text-xl text-brandDark"></i>
                            <div>+64 9 123 4567</div>
                        </div>
                        <div class="flex items-center gap-4">
                            <i class="fa-solid fa-location-dot text-xl text-brandDark"></i>
                            <div>Wellington, New Zealand</div>
                        </div>
                    </div>
                </div>
                <form class="space-y-5 bg-white p-6 rounded-lg shadow-md">
                    <div>
                        <label class="block text-sm font-medium mb-1">Name</label>
                        <input type="text" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-brandDark" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Email <span class="text-red-500">*</span></label>
                        <input type="email" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-brandDark" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Message</label>
                        <textarea rows="4" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-brandDark"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-brandDark hover:bg-brandMid text-white py-3 rounded transition">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="bg-white border-t border-gray-200 py-6">
        <div class="max-w-7xl mx-auto px-6 md:px-12 flex flex-col md:flex-row justify-between items-center text-sm text-gray-600">
            <div>© 2026 MGTECHNZ. All rights reserved.</div>
            <div class="mt-2 md:mt-0"><a href="privacy-policy.html" class="hover:text-brandDark">Privacy Policy</a> | info@mgtechnz.com | +64 9 123 4567</div>
        </div>
    </footer>
</body>
</html>
